<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riichi Mahjong</title>
  <!-- The site root, relative to this page: the server writes in the right one for each address
       (see PAGES in server.js), and every reference below is relative to it. -->
  <base href="./">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Front page: pick a name, then create a room or join one by code. -->
  <main id="lobby" class="screen" hidden>
    <h1>Riichi Mahjong</h1>
    <label class="field">Your name <input id="name" maxlength="20" autocomplete="nickname"></label>
    <div class="panels">
      <section class="panel">
        <h2>Create a room</h2>
        <div class="settings" id="create-settings"></div>
        <button id="create">Create room</button>
      </section>
      <section class="panel">
        <h2>Join a room</h2>
        <label class="field">Room code <input id="join-code" maxlength="6" placeholder="e.g. 3fa9c1" autocomplete="off"></label>
        <button id="join">Join room</button>
      </section>
    </div>
    <p class="error" id="lobby-error"></p>
    <p><button id="open-matches">Recent matches</button></p>
  </main>

  <!-- Recent matches: the server's recorded standard matches, newest first, with a search. -->
  <main id="matches" class="screen" hidden>
    <h1>Recent matches</h1>
    <p><button id="matches-back">Back</button></p>
    <label class="field">Search <input id="matches-search" placeholder="room code or start time" autocomplete="off"></label>
    <table id="matches-table">
      <thead><tr><th>Start time</th><th>Room code</th></tr></thead>
      <tbody></tbody>
    </table>
    <p class="hint" id="matches-note"></p>
  </main>

  <!-- One match's replay (replays/match?room=<code>&start=<time>): still to do. -->
  <main id="replay" class="screen" hidden>
    <h1>Match replay</h1>
    <p><button id="replay-back">Back</button></p>
    <p id="replay-which"></p>
    <p class="hint">Todo: replays aren't shown yet.</p>
  </main>

  <!-- Waiting room: seats fill up, the host picks settings and starts. -->
  <main id="waiting" class="screen" hidden>
    <h1>Room <span id="room-code"></span></h1>
    <p><button id="copy-link">Copy invite link</button> <span id="copied" hidden>Copied</span></p>
    <ol id="seat-list"></ol>
    <p id="spectator-count"></p>
    <section class="panel">
      <h2>Settings</h2>
      <div class="settings" id="room-settings"></div>
    </section>
    <p>
      <button id="start">Start match</button>
      <button id="leave-waiting">Leave</button>
    </p>
    <p class="hint" id="waiting-hint"></p>
  </main>

  <!-- The table. -->
  <div id="table" class="screen" hidden>
    <section class="seat seat-top" data-pos="top"></section>
    <section class="seat seat-left" data-pos="left"></section>
    <div id="middle">
    <section id="center">
      <div id="info"></div>
      <div id="controls">
        <button id="riichi" hidden>Riichi</button>
        <button id="tsumo" class="win" hidden>Tsumo</button>
        <button id="kyuushu" hidden>Abortive draw (9 terminals)</button>
        <button id="ron" class="win" hidden>Ron</button>
        <span id="call-options"></span>
        <button id="pass" hidden>Skip</button>
        <button id="exchange" hidden>Pass 3 tiles</button>
        <button id="next-hand" hidden>Next hand</button>
        <button id="rematch" hidden>Rematch</button>
        <button id="leave-table" hidden>Leave</button>
      </div>
      <!-- Auto play, per player, can be changed at any time (see autoPlay in server.js). -->
      <fieldset id="auto-settings" hidden>
        <legend>Auto</legend>
        <label><input type="checkbox" data-auto="win"> Ron and tsumo when possible</label>
        <label><input type="checkbox" data-auto="skipCalls"> Skip pon, chii and kan</label>
        <label><input type="checkbox" data-auto="tsumogiri"> Discard each draw (tsumogiri)</label>
      </fieldset>
      <label class="display-option"><input type="checkbox" id="algebraic"> Algebraic tiles (5p instead of pictures)</label>
      <p class="hint">Click a tile to discard. Press <kbd>Space</kbd> to discard the drawn tile.</p>
    </section>
    <!-- Dora indicators: revealed ones face up; ura dora flip when a riichi hand wins. -->
    <section id="dora-panel">
      <div class="dora-label">Dora:</div>
      <div class="dora-row" id="dora-row"></div>
      <div class="dora-label">Ura dora:</div>
      <div class="dora-row" id="ura-row"></div>
    </section>
    </div>
    <section class="seat seat-right" data-pos="right"></section>
    <section class="seat seat-bottom" data-pos="bottom"></section>
  </div>
  <script type="module" src="ui.js"></script>
</body>
</html>
